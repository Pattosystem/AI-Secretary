<title>AI秘書 SAI</title>

<style>
:root{--g:#158c70;--gd:#075c4d;--mint:#e8f7f1;--line:#dceae6;--ink:#122d43;--sub:#718492;--bg:#f6fbf9;--amber:#e9a33b;--red:#c0483e}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#fbfefe,#eff9f6);font-size:14px}
button,input,textarea,select{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(560px,1fr) 330px;max-width:1500px;margin:auto}

.side{background:rgba(255,255,255,.88);border-right:1px solid #edf3f1;padding:27px 20px;position:sticky;top:0;height:100vh}
.logo{font-size:25px;font-weight:900;color:var(--gd)}
.logo:before{content:"◒";color:var(--g);margin-right:10px}
.tagline{margin:3px 0 28px 38px;font-size:12px}
.nav button{width:100%;border:0;background:transparent;text-align:left;padding:13px 15px;border-radius:12px;margin:3px 0;color:var(--ink);font-weight:700;cursor:pointer}
.nav button.on{background:#def3ec;color:var(--g)}
.nav i{font-style:normal;width:31px;display:inline-block;font-size:18px}
.support{position:absolute;bottom:38px;left:20px;right:20px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 8px 24px #174d3c12}
.support b{display:block;font-size:15px;margin-bottom:5px}

.main{padding:50px 36px}
.date{color:#52748a;font-size:15px}
.hello{font-size:29px;font-weight:900;margin:10px 0 2px}
.lead{font-size:16px;margin:0 0 30px;color:#435f71}

.hero{border:1.5px solid #73d0b3;border-radius:20px;background:rgba(255,255,255,.96);padding:22px;box-shadow:0 15px 36px #175e4910}
.hero h2{font-size:19px;color:var(--gd);margin:0 0 5px}
.hero .desc{color:var(--sub);margin:0 0 15px}
.hero textarea{width:100%;height:125px;resize:vertical;border:1px solid #cfdee4;border-radius:14px;padding:17px;outline:none;font-size:15px;line-height:1.7;color:var(--ink);background:#fff}
.hero textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px #168b7018}
.herofoot{display:flex;gap:9px;margin-top:14px}
.soft,.primary{border:0;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}
.soft{background:#f0f7f5;color:#23465c}
.soft:disabled,.primary:disabled{opacity:.45;cursor:default}
.primary{background:linear-gradient(135deg,#19a17f,#08765f);color:#fff;margin-left:auto;padding-inline:27px}
.reply{margin-top:14px;background:#eff9f5;border-radius:13px;padding:14px 16px;line-height:1.7}
.reply.err{background:#fdeeec;color:var(--red)}
.reply b{color:var(--gd)}
.reply .undo{border:0;background:transparent;color:var(--g);font-weight:700;cursor:pointer;padding:0;margin-left:10px;text-decoration:underline}

.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 10px}
.sectionTitle h3{font-size:16px;margin:0}
.sectionTitle button{border:0;background:transparent;color:var(--g);font-weight:700;cursor:pointer}

.memories{display:grid;gap:9px}
.memory{background:#fff;border:1px solid #edf2f0;border-radius:15px;padding:15px 17px;box-shadow:0 7px 22px #164c3b0a;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:start;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.memory .icon{width:38px;height:38px;border-radius:11px;background:var(--mint);display:grid;place-items:center;font-size:18px}
.memory b{display:block;margin-bottom:3px}
.memory small{color:var(--sub);line-height:1.5;display:block}
.memory time{font-size:11px;color:#94a3ac;white-space:nowrap}
.memory.new{animation:pop .5s ease}
@keyframes pop{from{background:var(--mint)}to{background:#fff}}
@media(prefers-reduced-motion:reduce){.memory.new{animation:none}}
.memory .due{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--mint);color:var(--gd);margin-right:6px}
.memory .due.late{background:#fbe6e3;color:var(--red)}
.memory .due.today{background:#fdf1d9;color:#8c6113}
.memory .ttl.done{color:var(--sub);text-decoration:line-through}
.check{width:24px;height:24px;border-radius:50%;border:2px solid #cbd8d4;background:transparent;cursor:pointer;padding:0;display:grid;place-items:center;flex-shrink:0}
.check.on{border-color:var(--g);background:var(--g);color:#fff}

.empty{color:var(--sub);line-height:1.9;padding:22px 2px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

.right{padding:30px 28px 30px 0}
.profile{text-align:right;height:112px}
.profile b{font-size:15px}
.avatar{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--g);color:#fff;margin-right:8px}
.card{background:#fff;border:1px solid #edf1f1;border-radius:17px;padding:18px;margin-bottom:16px;box-shadow:0 9px 28px #164c3b0d}
.card h3{margin:0 0 14px;font-size:17px}
.notice{border-color:#f0dfbd;background:linear-gradient(145deg,#fffdf8,#fff)}
.notice h3{color:#805a18}
.notice.alert{border-color:#eec8c2;background:linear-gradient(145deg,#fff9f8,#fff)}
.notice.alert h3{color:var(--red)}
.noticeItem{padding:12px 0;border-top:1px solid #f2eadb;cursor:pointer}
.noticeItem:first-of-type{border-top:0;padding-top:3px}
.noticeItem b{display:block}
.noticeItem p{margin:4px 0 0;color:#5e6d77;line-height:1.55}
.ask h3{color:var(--gd)}
.ask p{color:var(--sub);line-height:1.65;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#f8fcfb;border-radius:999px;padding:7px 10px;color:#426257;cursor:pointer}
.status{display:flex;gap:10px;align-items:center;color:#58726a}
.dot{width:9px;height:9px;background:#21a17e;border-radius:50%;box-shadow:0 0 0 5px #e3f6ef;flex-shrink:0}

.search{width:100%;border:1px solid #cfdee4;border-radius:12px;padding:13px 15px;outline:none;font-size:15px;background:#fff;color:var(--ink);margin-bottom:16px}
.search:focus{border-color:var(--g)}

.scrim{position:fixed;inset:0;background:#0b2b2340;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px;padding:24px 22px;max-height:88vh;overflow:auto;box-shadow:0 24px 60px #0b2b2333}
.f{margin-bottom:15px}
.f label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:6px}
.f input,.f textarea{width:100%;font-size:15px;padding:11px 12px;border:1px solid #cfdee4;border-radius:10px;background:#fbfdfc;outline:0;color:var(--ink)}
.f input:focus,.f textarea:focus{border-color:var(--g);background:#fff}
.f textarea{resize:vertical;min-height:70px}
.seg{display:flex;gap:6px}
.seg button{flex:1;font-size:14.5px;font-weight:700;padding:11px 0;border-radius:10px;border:1.5px solid var(--line);background:#fbfdfc;color:var(--sub);cursor:pointer}
.seg button.on{border-color:var(--g);background:var(--g);color:#fff}
.sheetfoot{display:flex;gap:10px;align-items:center;margin-top:18px}
.sheetfoot .primary{flex:1;margin-left:0;text-align:center}
.del{background:none;border:0;color:var(--red);font-weight:700;cursor:pointer;padding:12px 8px}

.login{max-width:400px;margin:0 auto;padding:90px 24px}
.login .logo{text-align:center;font-size:30px}
.login .tagline{margin:6px 0 30px;text-align:center}
.login .primary{width:100%;margin:8px 0 0;padding:13px 0}
.login .err{color:var(--red);text-align:center;margin-top:12px}

.boot{padding:70px 24px;text-align:center;color:var(--sub)}

@media(max-width:1050px){.app{grid-template-columns:190px 1fr}.right{display:none}.main{padding:35px 25px}}
@media(max-width:720px){
  .app{display:block}
  .side{height:auto;position:static;padding:16px}
  .nav{display:flex;overflow:auto}
  .nav button{min-width:max-content}
  .support{display:none}
  .main{padding:25px 14px}
  .hello{font-size:23px}
  .herofoot{flex-wrap:wrap}
  .primary{margin-left:0;width:100%}
  .memory{grid-template-columns:40px 1fr}
  .memory time{grid-column:2}
}

/* ---------- 日付 ---------- */
const WD = ["日","月","火","水","木","金","土"];
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());

function toDate(w){
  if(!w) return null;
  const [dp,tp] = w.split("T");
  const [y,m,d] = dp.split("-").map(Number);
  if(!y) return null;
  if(tp){ const [hh,mm] = tp.split(":").map(Number); return new Date(y,m-1,d,hh||0,mm||0); }
  return new Date(y,m-1,d);
}
const dateOf = w => w ? w.split("T")[0] : null;
const timeOf = w => (w && w.includes("T")) ? w.split("T")[1] : null;

function dayLabel(ds){
  const d = toDate(ds);
  if(!d) return "";
  const diff = Math.round((d - toDate(todayStr()))/86400000);
  if(diff===0) return "今日";
  if(diff===1) return "明日";
  if(diff===2) return "明後日";
  if(diff===-1) return "昨日";
  if(diff<0) return `${Math.abs(diff)}日前`;
  return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;
}
function whenLabel(w){
  if(!w) return "";
  const t = timeOf(w);
  return dayLabel(dateOf(w)) + (t ? " " + t.slice(0,5) : "");
}
function agoLabel(ms){
  const d = new Date(ms), t = new Date();
  const diff = Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate()) - new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
  if(diff===0) return "今日";
  if(diff===1) return "昨日";
  return `${d.getMonth()+1}/${d.getDate()}`;
}

/* ---------- 変換 ---------- */
function fromRow(r){
  const when = r.due_date ? (r.due_time ? `${r.due_date}T${String(r.due_time).slice(0,5)}` : r.due_date) : null;
  return { id:r.id, kind:r.kind, title:r.title, when, place:r.place||"", note:r.note||"",
           done:!!r.done, created:new Date(r.created_at).getTime() };
}
function toRow(i){
  return { id:i.id, kind:i.kind, title:i.title,
           due_date:dateOf(i.when), due_time:timeOf(i.when)||null,
           place:i.place||"", note:i.note||"", done:!!i.done, updated_at:new Date().toISOString() };
}

const ICON = { event:"📅", task:"✅", memo:"💬" };
const KIND_JA = { event:"予定", task:"やること", memo:"メモ" };

/* ---------- 仕分け ---------- */
async function classify(text, token){
  const now = new Date();
  const prompt = `今は ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日(${WD[now.getDay()]}) ${pad(now.getHours())}:${pad(now.getMinutes())} 日本時間。

次の走り書きを、項目に分解してください。一文に複数の用件が混ざっていれば分けます。

出力はJSON配列のみ。前置き・説明・マークダウンのコードフェンスは一切書かない。
各要素:
{"kind":"event"|"task"|"memo","title":"短い見出し","when":"YYYY-MM-DDTHH:mm" または "YYYY-MM-DD" または null,"place":"場所 or 空文字","note":"補足 or 空文字"}

判定の基準:
- event = 決まった日時に人と会う/出向く/始まるもの（打合せ、訪問、会食、出張、通院）
- task = 自分がやる作業。締切があれば when に日付を入れる
- memo = 日時も作業もない、覚えておきたい情報
- 「来週火曜」「明後日」などは実際の日付に直す
- 時刻の指定がなければ日付だけ("YYYY-MM-DD")。日付も不明なら null
- title は原文の言葉を活かして20字以内
- note には原文の細かい部分を残す

走り書き:
${text}`;

  const res = await fetch(CLASSIFY_URL, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":SUPABASE_KEY, "Authorization":"Bearer "+token },
    body: JSON.stringify({ prompt })
  });
  if(!res.ok) throw new Error("api");
  const data = await res.json();
  const raw = (data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n")
    .replace(/```json|```/g,"").trim();
  const arr = JSON.parse(raw.slice(raw.indexOf("["), raw.lastIndexOf("]")+1));
  if(!Array.isArray(arr) || !arr.length) throw new Error("empty");
  return arr;
}

/* ============================================================ */
function Login({ onIn }){
  const [mail,setMail]=useState(""), [pw,setPw]=useState("");
  const [err,setErr]=useState(""), [busy,setBusy]=useState(false);
  async function go(){
    setBusy(true); setErr("");
    const { data, error } = await db.auth.signInWithPassword({ email:mail, password:pw });
    setBusy(false);
    if(error){ setErr("メールアドレスかパスワードが違います"); return; }
    onIn(data.session);
  }
  return (
    <div className="login">
      <div className="logo">AI秘書 SAI</div>
      <div className="tagline">話しておけば、忘れない。</div>
      <div className="f"><label>メールアドレス</label>
        <input type="email" value={mail} onChange={e=>setMail(e.target.value)} autoComplete="username"/></div>
      <div className="f"><label>パスワード</label>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} autoComplete="current-password"
          onKeyDown={e=>{ if(e.key==="Enter") go(); }}/></div>
      <button className="primary" onClick={go} disabled={busy||!mail||!pw}>{busy?"確認中…":"はじめる"}</button>
      {err && <div className="err">{err}</div>}
    </div>
  );
}

/* ============================================================ */
function App(){
  const [session,setSession]=useState(null);
  const [booted,setBooted]=useState(false);
  const [items,setItems]=useState([]);
  const [ready,setReady]=useState(false);
  const [view,setView]=useState("talk");
  const [text,setText]=useState("");
  const [busy,setBusy]=useState(false);
  const [reply,setReply]=useState(null);
  const [lastBatch,setLastBatch]=useState(null);
  const [fresh,setFresh]=useState([]);
  const [editing,setEditing]=useState(null);
  const [q,setQ]=useState("");

  useEffect(()=>{
    db.auth.getSession().then(({data})=>{ setSession(data.session); setBooted(true); });
    const { data:sub } = db.auth.onAuthStateChange((_e,s)=>setSession(s));

    return ()=>sub.subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!session){ setReady(false); return; }
    db.from("items").select("*").order("created_at",{ascending:true}).then(({data,error})=>{
      if(!error && data) setItems(data.map(fromRow));
      if(error) setReply({err:true,text:"記憶の読み込みに失敗しました。再読み込みしてください。"});
      setReady(true);
    });
  },[session]);

  async function remember(){
    const t = text.trim();
    if(!t || busy) return;
    setBusy(true); setReply(null);
    let parsed, fallback=false;
    try{ parsed = await classify(t, session.access_token); }
    catch{ parsed = [{kind:"memo",title:t.slice(0,40),when:null,place:"",note:t}]; fallback=true; }

    const stamp = Date.now();
    const made = parsed.map((p,i)=>({
      id:`${stamp}-${i}`,
      kind:["event","task","memo"].includes(p.kind)?p.kind:"memo",
      title:(p.title||t).slice(0,80),
      when:p.when||null, place:p.place||"", note:p.note||"",
      done:false, created:stamp
    }));

    const { error } = await db.from("items").insert(made.map(toRow));
    setBusy(false);
    if(error){ setReply({err:true,text:"覚えられませんでした。もう一度お試しください。"}); return; }

    setItems([...items,...made]);
    setLastBatch(made.map(m=>m.id));
    setFresh(made.map(m=>m.id));
    setTimeout(()=>setFresh([]),1500);
    setText("");

    const kinds = [...new Set(made.map(m=>KIND_JA[m.kind]))].join("・");
    setReply({ text: fallback
      ? `そのまま記憶しました。うまく整理できなかったので、メモとして残しています。`
      : `覚えておきます。${kinds}として${made.length}件、記憶しました。日時や期限のあるものは、必要なタイミングでお知らせします。`,
      undo:true });
  }

  async function undo(){
    if(!lastBatch) return;
    await db.from("items").delete().in("id",lastBatch);
    setItems(items.filter(i=>!lastBatch.includes(i.id)));
    setLastBatch(null); setReply(null);
  }

  async function upsert(it){
    const exists = items.some(x=>x.id===it.id);
    const { error } = exists
      ? await db.from("items").update(toRow(it)).eq("id",it.id)
      : await db.from("items").insert(toRow(it));
    if(error){ setReply({err:true,text:"保存できませんでした。"}); return; }
    setItems(exists ? items.map(x=>x.id===it.id?it:x) : [...items,it]);
    setEditing(null);
  }
  async function remove(id){
    await db.from("items").delete().eq("id",id);
    setItems(items.filter(x=>x.id!==id));
    setEditing(null);
  }
  async function toggle(id){
    const before = items;
    const it = items.find(x=>x.id===id);
    const next = !it.done;
    setItems(items.map(x=>x.id===id?{...x,done:next}:x));
    const { error } = await db.from("items").update({done:next,updated_at:new Date().toISOString()}).eq("id",id);
    if(error){ setItems(before); setReply({err:true,text:"更新できませんでした。"}); }
  }

  const B = useMemo(()=>{
    const today = todayStr();
    const live = items.filter(i=>!i.done);
    const recent = [...items].sort((a,b)=>b.created-a.created);
    const od = live.filter(i=>i.when && dateOf(i.when)<today).sort((a,b)=>a.when<b.when?-1:1);
    const todayList = live.filter(i=>i.when && dateOf(i.when)===today).sort((a,b)=>a.when<b.when?-1:1);
    const soonList = live.filter(i=>{
      const d = dateOf(i.when);
      if(!d || d<=today) return false;
      return (toDate(d) - toDate(today))/86400000 <= 7;
    }).sort((a,b)=>a.when<b.when?-1:1);
    const openTasks = live.filter(i=>i.kind==="task" && !i.when);
    return { recent, overdue:od, todayList, soonList, openTasks,
             events:items.filter(i=>i.kind==="event"),
             tasks:items.filter(i=>i.kind==="task"),
             memos:items.filter(i=>i.kind==="memo") };
  },[items]);

  if(!booted) return <div className="boot">読み込んでいます…</div>;
  if(!session) return <Login onIn={setSession}/>;
  if(!ready) return <div className="boot">記憶を呼び出しています…</div>;

  const now = new Date();
  const h = now.getHours();
  const greet = h<11 ? "おはようございます" : h<18 ? "こんにちは" : "こんばんは";

  return (
    <div className="app">
      <div className="sai-speech" aria-hidden="true">
        <b>SAIです。</b><br/>気になることがあれば、いつでも話してくださいね。
      </div>
      <aside className="side">
        <div className="logo">AI秘書 SAI</div>
        <div className="tagline">話しておけば、忘れない。</div>
        <nav className="nav">
          <button className={view==="talk"?"on":""} onClick={()=>setView("talk")}><i>⌂</i>SAIと話す</button>
          <button className={view==="memory"?"on":""} onClick={()=>setView("memory")}><i>◉</i>記憶</button>
          <button className={view==="search"?"on":""} onClick={()=>setView("search")}><i>⌕</i>過去を探す</button>
          <button className={view==="settings"?"on":""} onClick={()=>setView("settings")}><i>⚙</i>設定</button>
        </nav>
        <div className="support">
          <b>🤖 SAIは<br/>あなたの話を覚えています</b>
          <small>必要なときに、聞いてください。</small>
        </div>
      </aside>

      <main className="main">
        {view==="talk" && (
          <React.Fragment>
            <div className="date">{now.getFullYear()}年 {now.getMonth()+1}月{now.getDate()}日（{WD[now.getDay()]}）</div>
            <div className="hello">{greet}、坂口さん</div>
            <p className="lead">何でもそのまま話してください。必要なことはSAIが覚えておきます。</p>

            <section className="hero">
              <h2>✦ SAIに話す</h2>
              <p className="desc">メモでも、予定でも、思いつきでも。整理せず、そのままで大丈夫です。</p>
              <textarea value={text} onChange={e=>setText(e.target.value)}
                onKeyDown={e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter") remember(); }}
                placeholder="例：17日までにALLTITEの返事がなかったら確認したい。あと、ヘジョンさんにJaluproの価格を聞くこと。"/>
              <div className="herofoot">
                <button className="soft" onClick={()=>setEditing(blank("task"))}>✎ 自分で書く</button>
                <button className="soft" onClick={()=>setText("17日までにALLTITEの返事がなかったら確認したい。ヘジョンさんにJaluproの価格も聞いておきたい。")}>✦ 例を入れる</button>
                <button className="primary" onClick={remember} disabled={busy||!text.trim()}>
                  {busy?"覚えています…":"SAIに覚えてもらう"}
                </button>
              </div>
              {reply && (
                <div className={"reply"+(reply.err?" err":"")}>
                  {!reply.err && <React.Fragment><b>SAI</b><br/></React.Fragment>}
                  <span>{reply.text}</span>
                  {reply.undo && <button className="undo" onClick={undo}>取り消す</button>}
                </div>
              )}
            </section>

            <div className="sectionTitle">
              <h3>最近、SAIが覚えたこと</h3>
              <button onClick={()=>setView("memory")}>すべての記憶を見る →</button>
            </div>
            <section className="memories">
              {B.recent.length===0
                ? <div className="empty"><b>まだ何も覚えていません</b>上の欄に、思いついたことをそのまま書いてください。</div>
                : B.recent.slice(0,6).map(i=>(
                    <Memory key={i.id} i={i} fresh={fresh} onOpen={setEditing} onToggle={toggle}/>
                  ))}
            </section>
          </React.Fragment>
        )}

        {view==="memory" && (
          <React.Fragment>
            <div className="hello" style={{marginTop:0}}>記憶</div>
            <p className="lead">SAIが覚えていることの全部です。押すと直せます。</p>
            <Group title="予定" rows={sortByWhen(B.events)} fresh={fresh} onOpen={setEditing} onToggle={toggle}
              empty="予定はまだありません。"/>
            <Group title="やること" rows={sortByWhen(B.tasks)} fresh={fresh} onOpen={setEditing} onToggle={toggle}
              empty="やることはまだありません。"/>
            <Group title="メモ" rows={[...B.memos].sort((a,b)=>b.created-a.created)} fresh={fresh} onOpen={setEditing} onToggle={toggle}
              empty="メモはまだありません。"/>
          </React.Fragment>
        )}

        {view==="search" && (
          <React.Fragment>
            <div className="hello" style={{marginTop:0}}>過去を探す</div>
            <p className="lead">言葉の一部を入れると、記憶の中から探します。</p>
            <input className="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="たとえば「Jalupro」「田中」「見積」" autoFocus/>
            <section className="memories">
              {(() => {
                if(!q.trim()) return <div className="empty">探したい言葉を入れてください。</div>;
                const hit = B.recent.filter(r=>(r.title+r.note+r.place).toLowerCase().includes(q.trim().toLowerCase()));
                if(!hit.length) return <div className="empty"><b>見つかりませんでした</b>別の言葉で探してみてください。</div>;
                return hit.map(i=><Memory key={i.id} i={i} fresh={fresh} onOpen={setEditing} onToggle={toggle}/>);
              })()}
            </section>
          </React.Fragment>
        )}

        {view==="settings" && (
          <React.Fragment>
            <div className="hello" style={{marginTop:0}}>設定</div>
            <p className="lead">アカウントと記憶の状態です。</p>
            <section className="card">
              <h3>アカウント</h3>
              <p style={{margin:"0 0 14px",color:"var(--sub)"}}>{session.user.email}</p>
              <button className="soft" onClick={()=>db.auth.signOut()}>ログアウト</button>
            </section>
            <section className="card">
              <h3>記憶の数</h3>
              <p style={{margin:0,color:"var(--sub)",lineHeight:1.9}}>
                予定 {B.events.length}件／やること {B.tasks.length}件／メモ {B.memos.length}件
              </p>
            </section>
          </React.Fragment>
        )}
      </main>

      <aside className="right">
          <section className="secretary-card">
            <div className="secretary-copy">
              <div className="eyebrow">AI SECRETARY</div>
              <b>SAI</b>
              <p>必要なときに呼びかけてください。話した内容は、そのまま記録できます。</p>
            </div>
            <div className="secretary-status"><span className="secretary-status-text">SAIは待機中です</span></div>
          </section>
        <div className="profile">
          <span className="avatar">KS</span><b>坂口 孝太</b>
        </div>

        {B.overdue.length>0 && (
          <section className="card notice alert">
            <h3>⚠ 期限が過ぎています</h3>
            {B.overdue.slice(0,4).map(i=>(
              <div className="noticeItem" key={i.id} onClick={()=>setEditing(i)}>
                <b>{whenLabel(i.when)}のまま残っています</b>
                <p>{i.title}</p>
              </div>
            ))}
          </section>
        )}

        <section className="card notice">
          <h3>🔔 SAIからのお知らせ</h3>
          {(B.todayList.length + B.soonList.length + B.openTasks.length)===0 ? (
            <div className="noticeItem"><b>いまはお知らせがありません</b>
              <p>期限のあることを話しておけば、そのタイミングでお伝えします。</p></div>
          ) : (
            <React.Fragment>
              {B.todayList.map(i=>(
                <div className="noticeItem" key={i.id} onClick={()=>setEditing(i)}>
                  <b>今日{timeOf(i.when)?" "+timeOf(i.when).slice(0,5):""}です</b>
                  <p>{i.title}{i.place?`／${i.place}`:""}</p>
                </div>
              ))}
              {B.soonList.slice(0,3).map(i=>(
                <div className="noticeItem" key={i.id} onClick={()=>setEditing(i)}>
                  <b>{whenLabel(i.when)}に控えています</b>
                  <p>{i.title}</p>
                </div>
              ))}
              {B.openTasks.slice(0,2).map(i=>(
                <div className="noticeItem" key={i.id} onClick={()=>setEditing(i)}>
                  <b>まだ日時が決まっていません</b>
                  <p>{i.title}</p>
                </div>
              ))}
            </React.Fragment>
          )}
        </section>

        <section className="card ask">
          <h3>💭 こんなふうに聞けます</h3>
          <p>SAIは記録した内容から、必要な情報を探して答えます。</p>
          <div className="chips">
            {[{label:"この前のPRXの話は？",q:"PRX"},
              {label:"韓国の仕入先の話を探して",q:"韓国"},
              {label:"今週何か予定あった？",go:"memory"}].map(c=>(
              <button className="chip" key={c.label}
                onClick={()=>{ if(c.go){ setView(c.go); } else { setQ(c.q); setView("search"); } }}>{c.label}</button>
            ))}
          </div>
        </section>

        <section className="card">
          <div className="status"><span className="dot"></span>
            <div><b>SAIは待機中です</b><br/><small>必要なときに呼びかけてください</small></div>
          </div>
        </section>
      </aside>

      {editing && <Sheet item={editing} onSave={upsert} onDelete={remove} onClose={()=>setEditing(null)}/>}
    </div>
  );
}

function sortByWhen(rows){
  return [...rows].sort((a,b)=>((a.when||"9999")<(b.when||"9999")?-1:1));
}
function blank(kind){
  return { id:`m-${Date.now()}`, kind, title:"", when:null, place:"", note:"", done:false, created:Date.now(), isNew:true };
}

function Group({title,rows,fresh,onOpen,onToggle,empty}){
  return (
    <React.Fragment>
      <div className="sectionTitle"><h3>{title}<span style={{color:"var(--sub)",fontWeight:400,marginLeft:8,fontSize:13}}>{rows.length}</span></h3></div>
      <section className="memories">
        {rows.length===0 ? <div className="empty">{empty}</div>
          : rows.map(i=><Memory key={i.id} i={i} fresh={fresh} onOpen={onOpen} onToggle={onToggle}/>)}
      </section>
    </React.Fragment>
  );
}

function Memory({i,fresh,onOpen,onToggle}){
  const d = dateOf(i.when);
  const late = d && d<todayStr() && !i.done;
  const today = d===todayStr();
  const sub = [i.place, i.note].filter(Boolean).join("／");
  return (
    <div className={"memory"+(fresh.includes(i.id)?" new":"")}>
      {i.kind==="task"
        ? <button className={"check"+(i.done?" on":"")} onClick={()=>onToggle(i.id)}
            aria-label={i.done?"やり残しに戻す":"終わったことにする"}>{i.done?"✓":""}</button>
        : <div className="icon">{ICON[i.kind]}</div>}
      <div onClick={()=>onOpen(i)} style={{cursor:"pointer",minWidth:0}}>
        <b className={"ttl"+(i.done?" done":"")}>
          {i.when && <span className={"due"+(late?" late":today?" today":"")}>{whenLabel(i.when)}</span>}
          {i.title}
        </b>
        {sub && <small>{sub}</small>}
      </div>
      <time>{agoLabel(i.created)}</time>
    </div>
  );
}

function Sheet({item,onSave,onDelete,onClose}){
  const [f,setF]=useState({...item, d:dateOf(item.when)||"", t:(timeOf(item.when)||"").slice(0,5)});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  function commit(){
    const when = f.d ? (f.t ? `${f.d}T${f.t}` : f.d) : null;
    const {d,t,isNew,...rest} = f;
    onSave({...rest, when, title:(f.title||"無題").trim()});
  }
  return (
    <div className="scrim" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="f"><label>種類</label>
          <div className="seg">
            {["event","task","memo"].map(k=>(
              <button key={k} className={f.kind===k?"on":""} onClick={()=>set("kind",k)}>{KIND_JA[k]}</button>
            ))}
          </div>
        </div>
        <div className="f"><label>内容</label>
          <input value={f.title} onChange={e=>set("title",e.target.value)} placeholder="何のこと？" autoFocus={item.isNew}/></div>
        {f.kind!=="memo" && (
          <div style={{display:"flex",gap:10}}>
            <div className="f" style={{flex:1.3}}><label>{f.kind==="task"?"締切":"日付"}</label>
              <input type="date" value={f.d} onChange={e=>set("d",e.target.value)}/></div>
            <div className="f" style={{flex:1}}><label>時刻</label>
              <input type="time" value={f.t} onChange={e=>set("t",e.target.value)} disabled={!f.d}/></div>
          </div>
        )}
        {f.kind==="event" && (
          <div className="f"><label>場所</label>
            <input value={f.place} onChange={e=>set("place",e.target.value)} placeholder="どこで？"/></div>
        )}
        <div className="f"><label>補足</label>
          <textarea value={f.note} onChange={e=>set("note",e.target.value)}/></div>
        <div className="sheetfoot">
          {!item.isNew && <button className="del" onClick={()=>onDelete(item.id)}>忘れる</button>}
          <button className="primary" onClick={commit}>保存する</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
(function(){
  function fail(msg){
    document.getElementById("root").innerHTML =
      '<div style="max-width:560px;margin:60px auto;padding:0 20px;font-size:14px;line-height:1.8">'
      + '<div style="font-weight:700;margin-bottom:8px">起動できませんでした</div>'
      + '<div style="color:#718492;word-break:break-word">' + msg + '</div></div>';
  }
  try{
    if(!window.supabase) return fail("Supabaseの読み込みに失敗しました。通信環境を確認して再読み込みしてください。");
    if(!window.Babel) return fail("Babelの読み込みに失敗しました。通信環境を確認して再読み込みしてください。");
    var src = document.getElementById("app-src").textContent;
    var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    (0, eval)(out);
  }catch(e){
    fail((e && e.message) ? e.message : String(e));
  }
})();
</script>
</body>
</html>
